name: Update tool tags

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'usegalaxy-eu/tool-annotations'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install pyyaml==6.0.3
      - run: python scripts/update_tool_tags.py
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: auto-update-tool-tags
          delete-branch: true
          commit-message: Add tools and section tags from usegalaxy.eu, .org and .org.au
          title: Auto-update tool tags
          body: |
            Adds tools from usegalaxy.eu, usegalaxy.org and usegalaxy.org.au, tagged with their tool panel section.
            Existing tags are kept; ToolShed IDs that include a version are renamed to the versionless ID.

            Generated by `scripts/update_tool_tags.py`.
